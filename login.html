<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acceso simulado al sistema escolar">
  <title>Login | Sistema Escolar</title>

  <!-- Bootstrap 5 como base visual -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <main class="login-wrapper">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-block">
        <img src="img/logo.svg" alt="Logotipo del sistema" class="brand-logo">
        <div>
          <p class="brand-kicker">Sistema Escolar</p>
          <h1 id="login-title">Iniciar sesión</h1>
        </div>
      </div>

      <p class="login-intro">Ingresa un correo válido y una contraseña que cumpla los requisitos para acceder al sistema.</p>

      <div id="loginMessage" class="form-message" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            id="correo"
            name="correo"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            required
          >
          <div class="field-error" id="correoError"></div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="password-control">
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Mínimo 8 caracteres"
              autocomplete="current-password"
              required
            >
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
          <div class="field-error" id="passwordError"></div>
          <small class="password-help">Usa 8 o más caracteres, con mayúscula, minúscula, número y carácter especial.</small>
        </div>

        <button type="submit" class="btn btn-primary w-100 login-button">Iniciar sesión</button>
      </form>

    </section>
  </main>

  <script src="js/utileria.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
